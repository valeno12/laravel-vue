version: '3.8'

services:
  app:
    build:
      context: ./docker/php
    container_name: firstproyect_app
    volumes:
      - ./:/var/www/html
    ports:
      - "9000:9000"    # PHP-FPM (lo usa nginx, no el navegador)
      - "5173:5173"    # Vite (frontend dev)
    environment:
      CHOKIDAR_USEPOLLING: "true"   # para que Vite detecte cambios dentro de Docker
    networks:
      - laravel

  web:
    image: nginx:latest
    container_name: firstproyect_nginx
    depends_on:
      - app
    ports:
      - "8081:80"      # Entrás por http://localhost:8081
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: firstproyect_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: firstproyect
      MYSQL_USER: firstproyect
      MYSQL_PASSWORD: firstproyect
    ports:
      - "3307:3306"    # MySQL accesible en 3307 desde tu máquina
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - laravel

volumes:
  db-data:

networks:
  laravel:

